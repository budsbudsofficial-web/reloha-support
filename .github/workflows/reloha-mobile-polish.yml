name: RELOHA calendar copy wrap fix
on:
  push:
    paths:
      - .github/workflows/reloha-mobile-polish.yml
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: python3 -m pip install --break-system-packages Pillow opencv-python-headless
      - name: Refine realistic metallic device, uncropped screenshots and glass cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          source=Path("assets/screens")
          target=Path("mobile/screens")
          target.mkdir(parents=True,exist_ok=True)
          for file in source.glob("*.png"):
              image=Image.open(file).convert("RGB")
              # Remove the original iOS status bar, preserving the actual app UI.
              if file.stem in ("home","growth-ring"):
                  # The title overlaps the original iOS status-bar zone.
                  # Keep all original pixels and remove ONLY the small status icons
                  # using localized inpainting, never a full-width blur/padding strip.
                  import cv2, numpy as np
                  a=np.array(image)
                  mask=np.zeros(a.shape[:2],dtype=np.uint8)
                  h,w=mask.shape
                  # Status icons: left carrier, center clock, right signal/battery.
                  # Mask only topmost 35px, preserving app headings below.
                  mask[0:34,0:220]=255
                  mask[0:34,302:455]=255
                  mask[0:34,585:w]=255
                  result=cv2.inpaint(cv2.cvtColor(a,cv2.COLOR_RGB2BGR),mask,5,cv2.INPAINT_TELEA)
                  Image.fromarray(cv2.cvtColor(result,cv2.COLOR_BGR2RGB)).save(target/file.name,optimize=True)
              else:
                  # Leave all previously correct screens exactly as before.
                  cropped=image.crop((0,58,image.width,image.height))
                  cropped.save(target/file.name,optimize=True)
          p=Path("mobile/index.html")
          s=p.read_text()
          # Mobile-only copies: PC screenshots and desktop HTML stay untouched.
          s=s.replace('../assets/screens/','./screens/')
          marker="/* RELOHA MOBILE GLASS v2 */"
          if marker not in s:
              css="""<style>
          /* RELOHA MOBILE GLASS v2 */
          .after{padding:90px 17px 100px;background:radial-gradient(ellipse at 20% 15%,#fffdf6 0%,transparent 38%),linear-gradient(180deg,#f7f2e7,#edf1e7 62%,#f7f2e7)}
          .after>h2{letter-spacing:.045em}
          .after>p{max-width:325px;margin-inline:auto}
          .after .features{gap:68px;max-width:390px}
          .after .feature{padding:35px 15px 34px;border-radius:37px;border:1px solid rgba(255,255,255,.96);background:linear-gradient(135deg,rgba(255,255,255,.87),rgba(255,255,255,.43) 40%,rgba(223,235,226,.38) 78%,rgba(255,255,255,.7));box-shadow:0 27px 65px rgba(32,61,42,.13),0 2px 9px rgba(32,61,42,.035),inset 0 2px 1px rgba(255,255,255,1),inset 1px 0 1px rgba(255,255,255,.8);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5)}
          .after .feature:before{height:45%;background:linear-gradient(165deg,rgba(255,255,255,.8),rgba(255,255,255,.1) 65%,transparent)}
          .after .feature:after{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.58);border-radius:30px;pointer-events:none}
          .after .feature .label{font-size:10px;letter-spacing:.24em;color:#77947e}
          .after .feature img{width:min(65vw,258px);height:auto;max-height:none;aspect-ratio:750/1276;object-fit:cover;object-position:top;border:8px solid #26322d;border-radius:37px;box-shadow:0 28px 55px rgba(20,44,29,.31),0 8px 16px rgba(20,44,29,.13),0 0 0 1px rgba(255,255,255,.8),inset 0 1px 1px rgba(255,255,255,.7);filter:none}
          .after .feature h3{font-size:23px;line-height:1.55;letter-spacing:.03em;margin-top:23px}
          .after .feature p{max-width:265px;margin-inline:auto;line-height:2}
          #phone.phone{width:min(70vw,300px);height:auto;aspect-ratio:750/1276;max-height:60svh;padding:8px;border:1px solid rgba(255,255,255,.75);border-radius:clamp(32px,9vw,43px);background:linear-gradient(135deg,#66736a,#1a2520 34%,#151c18 72%,#5b675d);box-shadow:0 34px 85px rgba(20,48,31,.38),0 0 0 2px #27342d,inset 0 2px 2px rgba(255,255,255,.65)}
          #phone .screen{border-radius:clamp(25px,7vw,35px)}
          #phone .screen:before{display:none}
          #phone:before{display:none}
          #phone .screen img{object-fit:cover;object-position:top}
          .after .store{margin-top:16px;box-shadow:0 13px 30px rgba(26,67,41,.25)}
          @media(max-width:420px){.after .feature{margin-inline:2px}.after .features{gap:55px}}
          </style>"""
              assert "</head>" in s
              s=s.replace("</head>",css+"</head>",1)
          if "RELOHA MOBILE FINISH V3" not in s:
              glass_css = """
          /* RELOHA MOBILE FINISH V3 - FULL SCREEN AND TITANIUM */
          .after .feature{overflow:visible!important;isolation:isolate!important;position:relative!important;padding:37px 15px 42px!important;border:1px solid rgba(255,255,255,.95)!important;border-radius:38px!important;background:linear-gradient(135deg,rgba(255,255,255,.94) 0%,rgba(247,251,246,.62) 24%,rgba(223,236,226,.34) 54%,rgba(255,255,255,.78) 100%)!important;box-shadow:0 28px 65px rgba(26,61,43,.12),0 3px 10px rgba(26,61,43,.035),inset 0 2px 2px #fff,inset 0 -1px 1px rgba(255,255,255,.72)!important;backdrop-filter:blur(28px) saturate(1.6)!important;-webkit-backdrop-filter:blur(28px) saturate(1.6)!important}
          .after .feature:before{content:"";position:absolute;inset:0 0 auto;height:46%;border-radius:38px 38px 0 0;background:linear-gradient(165deg,rgba(255,255,255,.92),rgba(255,255,255,.10) 72%,transparent);pointer-events:none}
          .after .feature:after{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.65);border-radius:31px;pointer-events:none}
          .after .feature img{display:block!important;width:min(68vw,280px)!important;height:auto!important;max-height:none!important;aspect-ratio:auto!important;object-fit:contain!important;object-position:center top!important;margin:28px auto 0!important;padding:5px!important;background:linear-gradient(125deg,#e3e9e6 0%,#75837f 12%,#dce5e0 24%,#333e3b 38%,#151e1a 63%,#8c9b96 88%,#e4ebe6 100%)!important;border:3px solid #34433e!important;border-radius:clamp(29px,8vw,44px)!important;box-shadow:0 24px 44px rgba(15,40,29,.24),0 5px 13px rgba(16,37,29,.12),0 0 0 1px rgba(255,255,255,.86),inset 1px 0 1px rgba(255,255,255,.92),inset -2px 0 2px rgba(0,0,0,.48)!important;filter:none!important;position:relative;z-index:2}
          .after .feature h3{margin-top:30px!important;position:relative;z-index:2}
          .after .feature p,.after .feature .label{position:relative;z-index:2}
          #phone.phone{width:min(73vw,315px)!important;height:auto!important;aspect-ratio:750/1294!important;max-height:none!important;padding:7px!important;background:linear-gradient(112deg,#d9e0dd 0%,#7c8984 4%,#2e3b35 10%,#0d1812 52%,#677870 91%,#e3e8e4 100%)!important;border:2px solid #596a61!important;border-radius:clamp(35px,9vw,47px)!important;box-shadow:0 25px 65px rgba(16,39,27,.33),0 0 0 1px rgba(250,255,251,.88),inset 2px 0 2px rgba(255,255,255,.76),inset -3px 0 2px rgba(0,0,0,.4)!important}
          #phone .screen{border-radius:clamp(27px,7vw,39px)!important;overflow:hidden!important}
          #phone .screen img{width:100%!important;height:100%!important;object-fit:contain!important;object-position:center top!important}
          #phone:before{display:none!important}
          @media(max-width:430px){.after .features{gap:60px!important}.after .feature{margin-inline:4px!important}}
              """
              s=s.replace("</head>","<style>"+glass_css+"</style></head>",1)
          # Remove the previous header-padding override if it was applied.
          s=re.sub(r'<style>/\\* RELOHA MOBILE HEADER V4 \\*/.*?</style>','',s,flags=re.S)
          # Calendar copy only: keep every existing visual style untouched.
          s=s.replace('植物と過ごした日々を、カレンダーで振り返る。','植物と過ごした日々を、<br>カレンダーで振り返る。')
          p.write_text(s)
          PY
      - name: Commit mobile-only updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/index.html mobile/screens/
          git diff --cached --quiet || (git commit -m "Enhance mobile glass styling and remove iOS status bars" && git push)
